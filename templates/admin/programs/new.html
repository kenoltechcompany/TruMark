{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto bg-white shadow rounded-lg p-6">
    <div class="mb-6">
        <h2 class="text-2xl font-bold">Add New Program</h2>
    </div>

    <form method="POST" action="{{ url_for('new_program') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="space-y-4">
            <div>
                <label for="program_name" class="block text-sm font-medium text-gray-700">Program Name</label>
                <input type="text" name="program_name" id="program_name" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            
            <div>
                <label for="duration_years" class="block text-sm font-medium text-gray-700">Duration (Years)</label>
                <input type="number" name="duration_years" id="duration_years" required min="1" max="6"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div class="flex justify-end space-x-4">
                <a href="{{ url_for('list_programs') }}" 
                   class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                    Cancel
                </a>
                <button type="submit" 
                        class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    Create Program
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
