# ============================================================
# TruMark — Docker Compose
# Orchestrates four services:
#   trumark-db           - PostgreSQL database
#   trumark-face-service - InsightFace biometric microservice
#   trumark-backend      - NestJS API server
#   trumark-frontend     - Nginx web server (React SPA)
# ============================================================
services:

  trumark-db:
    image: postgres:16-alpine
    container_name: trumark-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trumark}
      POSTGRES_USER: ${POSTGRES_USER:-trumark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trumark_secret}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trumark} -d ${POSTGRES_DB:-trumark}"]
      interval: 5s
      timeout: 3s
      retries: 5

  trumark-face-service:
    build:
      context: ./face-service
      dockerfile: Dockerfile
    container_name: trumark-face-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      FACE_MODEL_NAME: ${FACE_MODEL_NAME:-buffalo_sc}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.65}
    volumes:
      - insightface_models:/root/.insightface

  trumark-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trumark-backend
    restart: unless-stopped
    depends_on:
      trumark-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-trumark}:${POSTGRES_PASSWORD:-trumark_secret}@trumark-db:5432/${POSTGRES_DB:-trumark}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FACE_PROVIDER: ${FACE_PROVIDER:-insightface}
      FACE_SERVICE_URL: ${FACE_SERVICE_URL:-http://trumark-face-service:8000}
      AZURE_FACE_ENDPOINT: ${AZURE_FACE_ENDPOINT:-}
      AZURE_FACE_KEY: ${AZURE_FACE_KEY:-}
    volumes:
      - backend_uploads:/app/uploads

  trumark-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trumark-frontend
    restart: unless-stopped
    depends_on:
      - trumark-backend
    ports:
      - "80:80"

volumes:
  pgdata:
  insightface_models:
  backend_uploads:
