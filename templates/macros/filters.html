{% macro render_search_bar(search_value='', placeholder='Search...') %}
<div class="flex-1 max-w-md">
    <div class="relative">
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
        </div>
        <input type="text" 
               id="search" 
               name="search" 
               value="{{ search_value }}"
               placeholder="{{ placeholder }}"
               class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:placeholder-gray-400 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
    </div>
</div>
{% endmacro %}

{% macro render_filter_dropdown(name, options, selected='', label='Filter', show_all=True) %}
<div class="flex flex-col">
    {% if label %}
        <label for="{{ name }}" class="text-sm font-medium text-gray-700 mb-1">{{ label }}</label>
    {% endif %}
    <select id="{{ name }}" 
            name="{{ name }}"
            class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
        {% if show_all %}
            <option value="">All</option>
        {% endif %}
        {% for option in options %}
            <option value="{{ option.value }}" {% if selected == option.value|string %}selected{% endif %}>
                {{ option.text }}
            </option>
        {% endfor %}
    </select>
</div>
{% endmacro %}

{% macro render_status_filter(selected='') %}
<div class="flex flex-col">
    <label for="status" class="text-sm font-medium text-gray-700 mb-1">Status</label>
    <select id="status" 
            name="status"
            class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
        <option value="">All</option>
        <option value="active" {% if selected == 'active' %}selected{% endif %}>Active</option>
        <option value="inactive" {% if selected == 'inactive' %}selected{% endif %}>Inactive</option>
    </select>
</div>
{% endmacro %}
