# Docker Compose for local development and testing
version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      # Mount code for hot reload in development
      - .:/app
      # Persist uploads and database
      - ./instance:/app/instance
      - ./uploads:/app/uploads
    command: flask run --host=0.0.0.0 --port=5000 --debug

