{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto bg-white shadow rounded-lg p-6">
    <div class="mb-6">
        <h2 class="text-2xl font-bold">Edit Class</h2>
    </div>

    <form method="POST" action="{{ url_for('edit_class', class_id=cur_class.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="space-y-4">            
            <div>
                <label for="program_id" class="block text-sm font-medium text-gray-700">Program</label>
                <select name="program_id" id="program_id" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    {% for program in programs %}
                    <option value="{{ program.id }}" {% if program.id == cur_class.program_id %}selected{% endif %}>
                        {{ program.program_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label for="group" class="block text-sm font-medium text-gray-700">Group</label>
                <input type="text" name="group" id="group" required maxlength="1"
                       value="{{ cur_class.group }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div>
                <label for="year_group" class="block text-sm font-medium text-gray-700">Year Group</label>
                <input type="text" name="year_group" id="year_group" required
                       value="{{ cur_class.year_group }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            <div>
                <label for="session_name" class="block text-sm font-medium text-gray-700">Session</label>
                <select name="session_name" id="session_name" required
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    {% for session in sessions %}
                    <option value="{{ session }}" {% if session == cur_class.session %}selected{% endif %}>
                        {{ session }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex justify-end space-x-4">
                <a href="{{ url_for('list_classes') }}" 
                   class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                    Cancel
                </a>
                <button type="submit" 
                        class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    Save Changes
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
