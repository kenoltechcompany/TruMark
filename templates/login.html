{% extends 'base.html' %}

{% block content %}
    <div class="max-w-md mx-auto mt-10">
        <div class="bg-white shadow rounded-lg">
            <div class="p-4 border-b">
                <h3 class="text-center text-xl font-semibold">Admin Login</h3>
            </div>
            <div class="p-4">
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for message in messages %}
                            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-2">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                    <div class="mb-4">
                        <label for="username" class="block text-sm font-medium text-gray-700">Username:</label>
                        <input type="text" class="mt-1 block w-full rounded border-gray-300" id="username" name="username" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="block text-sm font-medium text-gray-700">Password:</label>
                        <input type="password" class="mt-1 block w-full rounded border-gray-300" id="password" name="password" required>
                    </div>
                    <div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded">
                            Login
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
{% endblock %}
