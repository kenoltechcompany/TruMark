{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto bg-white shadow rounded-lg p-6">
    <div class="mb-6">
        <h2 class="text-2xl font-bold">Add New User</h2>
    </div>

    <form method="POST" action="{{ url_for('new_user') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" name="username" id="username" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" id="password" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            
            <div class="space-y-2">
                <div class="flex items-center">
                    <input type="checkbox" name="is_admin" id="is_admin"
                           class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="is_admin" class="ml-2 block text-sm text-gray-700">Administrator</label>
                </div>
                
                <div class="flex items-center">
                    <input type="checkbox" name="is_lecturer" id="is_lecturer"
                           class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="is_lecturer" class="ml-2 block text-sm text-gray-700">Lecturer</label>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" name="is_rep" id="is_rep" onchange="toggleClassSelection()"
                           class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="is_rep" class="ml-2 block text-sm text-gray-700">Class Representative</label>
                </div>
            </div>            <div id="class_selection" style="display: none;">
                <label for="class_id" class="block text-sm font-medium text-gray-700">Class</label>
                <select name="class_id" id="class_id"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    {% for class in classes %}
                    <option value="{{ class.id }}">{{ class.program.get_short_name() }} Group {{ class.group}} || {{class.year_group}}</option>
                    {% endfor %}
                </select>
            </div>

            <div id="teaching_classes_selection" style="display: none;">
                <label class="block text-sm font-medium text-gray-700">Teaching Classes</label>
                <div class="mt-2 space-y-2 max-h-60 overflow-y-auto border rounded-md p-3">
                    {% for class in classes %}
                    <div class="flex items-center">
                        <input type="checkbox" name="teaching_classes" value="{{ class.id }}"
                               class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                        <label class="ml-2 text-sm text-gray-700">
                            {{ class.program.get_short_name() }} Group {{ class.group }} || {{ class.year_group }}
                        </label>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="flex justify-end space-x-4">
                <a href="{{ url_for('list_users') }}" 
                   class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                    Cancel
                </a>
                <button type="submit" 
                        class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                    Create User
                </button>
            </div>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Add listener for rep checkbox
    document.getElementById('is_rep').addEventListener('change', function() {
        toggleClassSelection();
    });

    // Add listener for lecturer checkbox
    document.getElementById('is_lecturer').addEventListener('change', function() {
        toggleTeachingClassesSelection();
    });
});

function toggleClassSelection() {
    const isRep = document.getElementById('is_rep').checked;
    const classSelection = document.getElementById('class_selection');
    classSelection.style.display = isRep ? 'block' : 'none';
    const classInput = document.getElementById('class_id');
    classInput.required = isRep;
}

function toggleTeachingClassesSelection() {
    const isLecturer = document.getElementById('is_lecturer').checked;
    const teachingClassesSelection = document.getElementById('teaching_classes_selection');
    teachingClassesSelection.style.display = isLecturer ? 'block' : 'none';
    
    // Remove the required attribute from individual checkboxes
    const checkboxes = teachingClassesSelection.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(checkbox => checkbox.required = false);
}

// Add form validation to ensure at least one class is selected for lecturers
document.querySelector('form').addEventListener('submit', function(e) {
    const isLecturer = document.getElementById('is_lecturer').checked;
    if (isLecturer) {
        const selectedClasses = document.querySelectorAll('input[name="teaching_classes"]:checked').length;
        if (selectedClasses === 0) {
            e.preventDefault();
            alert('Please select at least one teaching class for the lecturer');
        }
    }
});
</script>
{% endblock %}
