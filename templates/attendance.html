{% extends "base.html" %}

{% block show_navbar %}{% endblock %}

{% block content %}
<style>
@media (max-width: 768px) {
    .camera-container {
        width: 100% !important;
        height: auto !important;
    }
    video, canvas {
        width: 100% !important;
        height: auto !important;
    }
}
</style>

<div class="max-w-2xl mx-auto bg-white shadow rounded-lg p-6">
    <h2 class="text-2xl font-bold mb-6">Mark Attendance for {{ session.course.course_name }}</h2>
    
    <div class="relative mb-6 camera-container" style="width: 640px; height: 480px; margin: 0 auto;">
        <video id="video" width="640" height="480" autoplay muted class="mx-auto border rounded-lg"></video>
    </div>
    
    <div id="status" class="text-center text-lg mb-4 p-2"></div>
    <div id="controls" class="text-center space-x-4 mt-4 relative z-10">
        <button id="startButton" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
            Start Camera
        </button>
        <button id="captureButton" style="display: none;" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            Mark Attendance
        </button>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
const video = document.getElementById('video');
const status = document.getElementById('status');
const startButton = document.getElementById('startButton');
const captureButton = document.getElementById('captureButton');

let stream = null;

async function startCamera() {
    try {
        status.textContent = 'Initializing camera...';
        status.className = 'text-center text-lg mb-4 p-2 bg-yellow-100 text-yellow-700';
        
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile && window.location.protocol === 'http:') {
                status.innerHTML = `
                    <strong>Camera access requires HTTPS on mobile devices.</strong><br>
                    Please access this application using a secure (HTTPS) connection.
                `;
            } else {
                status.textContent = 'Camera API not supported on this device or browser';
            }
            
            status.className = 'text-center text-lg mb-4 p-2 bg-red-100 text-red-700';
            return;
        }
        
        stream = await navigator.mediaDevices.getUserMedia({ 
            video: {
                width: { ideal: 640 },
                height: { ideal: 480 },
                facingMode: 'user'
            }
        });
        
        video.srcObject = stream;
        
        await new Promise((resolve) => {
            video.onloadedmetadata = () => {
                video.play();
                resolve();
            };
        });
        
        status.textContent = 'Camera ready. Position your face in the frame and click "Mark Attendance".';
        status.className = 'text-center text-lg mb-4 p-2 bg-green-100 text-green-700';
        
        startButton.style.display = 'none';
        captureButton.style.display = 'inline-block';
        
    } catch (error) {
        console.error('Camera error:', error);
        status.textContent = 'Error: ' + error.message;
        status.className = 'text-center text-lg mb-4 p-2 bg-red-100 text-red-700';
    }
}

async function captureAndMarkAttendance() {
    try {
        status.textContent = 'Capturing image...';
        status.className = 'text-center text-lg mb-4 p-2 bg-yellow-100 text-yellow-700';
        captureButton.disabled = true;
        
        // Capture frame from video
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        
        // Convert to base64
        const imageData = canvas.toDataURL('image/jpeg', 0.95);
        
        status.textContent = 'Getting location...';
        
        // Get location
        const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            });
        });
        
        status.textContent = 'Processing attendance...';
        
        // Send to backend
        const response = await fetch('/api/mark-attendance', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify({
                session_id: "{{ session.id }}",
                face_image: imageData,
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                altitude: position.coords.altitude || 0
            })
        });
        
        const result = await response.json();
        
        if (result.error) {
            status.textContent = result.error;
            
            if (result.error.includes('already marked')) {
                status.className = 'text-center text-lg mb-4 p-2 bg-blue-100 text-blue-700';
                setTimeout(() => {
                    window.location.href = `/attendance/success/${encodeURIComponent(result.student_name)}?in_classroom=true&sessionid={{session.id}}`;
                }, 2000);
            } else if (result.error.includes('Access denied')) {
                status.className = 'text-center text-lg mb-4 p-2 bg-red-100 text-red-700';
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            } else {
                status.className = 'text-center text-lg mb-4 p-2 bg-yellow-100 text-yellow-700';
                captureButton.disabled = false;
            }
        } else {
            status.textContent = `Attendance marked successfully for ${result.student_name}!`;
            status.className = 'text-center text-lg mb-4 p-2 bg-green-100 text-green-700';
            
            // Stop camera
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            // Redirect to success page
            setTimeout(() => {
                window.location.href = `/attendance/success/${encodeURIComponent(result.student_name)}?in_classroom=${result.in_classroom}&sessionid={{session.id}}`;
            }, 1500);
        }
    } catch (error) {
        console.error('Error:', error);
        status.textContent = 'Error: ' + error.message;
        status.className = 'text-center text-lg mb-4 p-2 bg-red-100 text-red-700';
        captureButton.disabled = false;
    }
}

startButton.addEventListener('click', startCamera);
captureButton.addEventListener('click', captureAndMarkAttendance);

// Auto-start camera when page loads
document.addEventListener('DOMContentLoaded', () => {
    status.textContent = 'Ready to start. Click "Start Camera" when ready.';
    status.className = 'text-center text-lg mb-4 p-2 bg-blue-100 text-blue-700';
});
</script>
{% endblock %}
