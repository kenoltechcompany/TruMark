services:
  # Web Service
  - type: web
    name: trumark
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FLASK_DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trumark-db
          property: connectionString
    healthCheckPath: /
    autoDeploy: true

  # PostgreSQL Database
  - type: pserv
    name: trumark-db
    plan: free
    env: docker
    dockerfilePath: ./Dockerfile.postgres

databases:
  - name: trumark-db
    databaseName: trumark
    user: trumark
    plan: free
