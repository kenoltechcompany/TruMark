# TruMark Frontend — Nginx configuration
# Serves the Vite-built SPA and proxies /api calls to the backend container.

server {
    listen 80;
    server_name _;

    # Serve static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://trumark-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Increase timeout for long-running requests (face sync etc.)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Proxy uploads to the backend
    location /uploads/ {
        proxy_pass http://trumark-backend:3000;
    }
}
